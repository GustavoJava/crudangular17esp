<div class="dialog-container">
  <!-- Cabeçalho -->
  <div mat-dialog-title class="dialog-header">
    <div class="icon-badge">
      <mat-icon color="warn">warning</mat-icon>
    </div>
    <span class="dialog-title-text">{{ data.title }}</span>
  </div>

  <!-- Conteúdo -->
  <mat-dialog-content class="dialog-content">
    <p class="dialog-message">{{ data.message }}</p>

    @if (data.itemName) {
      <div class="item-card">
        <mat-icon class="item-icon">inventory_2</mat-icon>
        <span class="item-name">{{ data.itemName }}</span>
      </div>
    }
  </mat-dialog-content>

  <!-- Ações -->
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button [mat-dialog-close]="false" cdkFocusInitial class="btn-cancel">
      Cancelar
    </button>
    <button mat-flat-button color="warn" [mat-dialog-close]="true" class="btn-confirm">
      <mat-icon>delete</mat-icon>
      Excluir
    </button>
  </mat-dialog-actions>
</div>
